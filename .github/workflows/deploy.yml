name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        default: Preview
        type: choice
        options:
          - Preview
          - Production

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      PUBLIC_CONVEX_SITE_URL: https://placeholder.convex.site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run loop-verify gate
        run: bash scripts/loop-verify.sh

  component:
    name: Component suite (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      PUBLIC_CONVEX_SITE_URL: https://placeholder.convex.site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Read Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('./node_modules/playwright/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Component tests (vitest browser)
        run: npm run test:component
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-component-screenshots
          path: src/**/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7

  deploy-convex:
    name: Deploy Convex (${{ inputs.environment }})
    needs: [verify, component]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Deploy Convex schema and functions first
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "CONVEX_DEPLOY_KEY secret is required for ${{ inputs.environment }}"
            exit 1
          fi
          npx convex deploy --yes

  deploy-vercel:
    name: Promote Vercel (${{ inputs.environment }})
    needs: deploy-convex
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Pull, build, and deploy Vercel artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PUBLIC_CONVEX_URL: ${{ vars.PUBLIC_CONVEX_URL }}
          PUBLIC_CONVEX_SITE_URL: ${{ vars.PUBLIC_CONVEX_SITE_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets are required"
            exit 1
          fi
          if [ "${{ inputs.environment }}" = "Production" ]; then
            npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx vercel build --prod --token="$VERCEL_TOKEN"
            npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            npx vercel build --token="$VERCEL_TOKEN"
            npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
