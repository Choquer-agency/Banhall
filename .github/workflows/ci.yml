name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # svelte-kit sync materializes $env/static/public from the environment;
      # the typecheck needs the member to exist, not a live deployment.
      PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm test
