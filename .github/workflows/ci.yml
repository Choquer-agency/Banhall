name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # svelte-kit sync materializes $env/static/public from the environment and
      # the auth adapter imports both names; the gate needs the members to
      # exist, not a live deployment.
      PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      PUBLIC_CONVEX_SITE_URL: https://placeholder.convex.site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # pwsh is preinstalled on ubuntu-latest (Ubuntu 24.04 image).
      - name: Verification gate
        run: bash scripts/loop-verify.sh

  component:
    name: Component suite (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      PUBLIC_CONVEX_SITE_URL: https://placeholder.convex.site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Component tests (vitest browser)
        run: npm run test:component
